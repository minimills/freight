<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <a href="index.html" class="navbar-brand-link">
        <span class="navbar-logo">FM</span>
        <span>Freight Multitool</span>
      </a>
    </div>
    <ul class="navbar-links">
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="freight.html">Cost Breakdown</a></li>
      <li><a href="incoming.html">Incoming</a></li>
      <li><a href="convert.html" class="active">Unit Converter</a></li>
      <li><a href="email.html">Email Agent</a></li>
    </ul>
  </nav>

  <div class="app">
    <header class="app-header">
      <h1>Unit Converter</h1>
      <p class="subtitle">Length, dimensions (volume/area), and weight conversions</p>
    </header>

    <main class="layout">
      <section class="card form-card">
        <h2 class="section-title">Length</h2>
        <section class="field-group">
          <div class="field">
            <label for="lengthValue">Value</label>
            <input type="number" id="lengthValue" step="any" placeholder="0">
          </div>
          <div class="field">
            <label for="lengthUnit">Unit</label>
            <select id="lengthUnit">
              <option value="mm">Millimeters (mm)</option>
              <option value="cm">Centimeters (cm)</option>
              <option value="m">Meters (m)</option>
              <option value="in">Inches (in)</option>
              <option value="ft">Feet (ft)</option>
            </select>
          </div>
        </section>

        <hr class="divider">

        <h2 class="section-title">Dimensions (L × W × H)</h2>
        <section class="field-group three-col">
          <div class="field">
            <label for="dimLength">Length</label>
            <input type="number" id="dimLength" step="any" placeholder="0">
          </div>
          <div class="field">
            <label for="dimLengthUnit">Unit</label>
            <select id="dimLengthUnit" class="dim-unit">
              <option value="mm">mm</option>
              <option value="cm">cm</option>
              <option value="m">m</option>
              <option value="in">in</option>
              <option value="ft">ft</option>
            </select>
          </div>
          <div class="field">
            <label for="dimWidth">Width</label>
            <input type="number" id="dimWidth" step="any" placeholder="0">
          </div>
          <div class="field">
            <label for="dimWidthUnit">Unit</label>
            <select id="dimWidthUnit" class="dim-unit">
              <option value="mm">mm</option>
              <option value="cm">cm</option>
              <option value="m">m</option>
              <option value="in">in</option>
              <option value="ft">ft</option>
            </select>
          </div>
          <div class="field">
            <label for="dimHeight">Height</label>
            <input type="number" id="dimHeight" step="any" placeholder="0">
          </div>
          <div class="field">
            <label for="dimHeightUnit">Unit</label>
            <select id="dimHeightUnit" class="dim-unit">
              <option value="mm">mm</option>
              <option value="cm">cm</option>
              <option value="m">m</option>
              <option value="in">in</option>
              <option value="ft">ft</option>
            </select>
          </div>
        </section>

        <hr class="divider">

        <h2 class="section-title">Weight</h2>
        <section class="field-group">
          <div class="field">
            <label for="weightValue">Value</label>
            <input type="number" id="weightValue" step="any" placeholder="0">
          </div>
          <div class="field">
            <label for="weightUnit">Unit</label>
            <select id="weightUnit">
              <option value="g">Grams (g)</option>
              <option value="kg">Kilograms (kg)</option>
              <option value="lb">Pounds (lb)</option>
            </select>
          </div>
        </section>
      </section>

      <section class="card results-card">
        <h2 class="section-title">Length Conversions</h2>
        <section class="results" id="lengthResults"></section>

        <hr class="divider">

        <h2 class="section-title">Volume &amp; Area</h2>
        <section class="results" id="dimResults"></section>

        <hr class="divider">

        <h2 class="section-title">Weight Conversions</h2>
        <section class="results" id="weightResults"></section>
      </section>
    </main>
  </div>

  <script src="convert.js?v=1"></script>
</body>
</html>
