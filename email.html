<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Shipping Agent</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <a href="index.html" class="navbar-brand-link">
        <span class="navbar-logo">FM</span>
        <span>Freight Multitool</span>
      </a>
    </div>
    <ul class="navbar-links">
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="freight.html">Cost Breakdown</a></li>
      <li><a href="incoming.html">Incoming</a></li>
      <li><a href="convert.html">Unit Converter</a></li>
      <li><a href="email.html" class="active">Email Agent</a></li>
    </ul>
  </nav>

  <div class="app">
    <header class="app-header">
      <h1>Email Shipping Agent</h1>
      <p class="subtitle">Fill in shipment details and generate a quote request email</p>
    </header>

    <main class="layout">
      <section class="card form-card">
        <h2 class="section-title">Agent &amp; Shipment</h2>
        <section class="field-group">
          <div class="field">
            <label for="agentSelect">Agent</label>
            <select id="agentSelect">
              <option value="Nicole MacDonald">Nicole MacDonald</option>
              <option value="new">New Agent…</option>
            </select>
          </div>
          <div class="field" id="newAgentField" hidden>
            <label for="newAgentName">Agent Name</label>
            <input type="text" id="newAgentName" placeholder="Agent full name">
          </div>
          <div class="field">
            <label for="greeting">Greeting</label>
            <select id="greeting">
              <option value="Hi">Hi</option>
              <option value="Hello">Hello</option>
              <option value="Dear">Dear</option>
            </select>
          </div>
          <div class="field">
            <label for="shipmentType">Shipment Type</label>
            <select id="shipmentType">
              <option value="LTL">LTL</option>
              <option value="FTL">FTL</option>
              <option value="LCL">LCL</option>
              <option value="FCL">FCL</option>
            </select>
          </div>
          <div class="field">
            <label for="originState">Origin State/Province</label>
            <input type="text" id="originState" placeholder="e.g. ON">
          </div>
          <div class="field">
            <label for="destinationState">Destination State/Province</label>
            <input type="text" id="destinationState" placeholder="e.g. NY">
          </div>
        </section>

        <hr class="divider">

        <h2 class="section-title">Pick Up &amp; Delivery</h2>
        <section class="field-group">
          <div class="field full-width">
            <label for="pickupType">Pick Up</label>
            <select id="pickupType">
              <option value="0">Belfast Mini Mills Ltd. — 1820 Garfield Road, Belfast. PE. C0A 1A0</option>
              <option value="new">Type Pick Up Address</option>
            </select>
          </div>
          <div class="field full-width" id="newPickupField" hidden>
            <label for="newPickupAddress">Pick Up Address</label>
            <input type="text" id="newPickupAddress" class="address-autocomplete" autocomplete="off" placeholder="Start typing an address…">
          </div>

          <div class="field full-width">
            <label for="deliveryType">Delivery</label>
            <select id="deliveryType">
              <option value="new" selected>Type Delivery Address</option>
              <option value="0">Belfast Mini Mills Ltd. — 1820 Garfield Road, Belfast. PE. C0A 1A0</option>
              <option value="1">Belfast Mini Mills — 627 Greek River Rd, Murray River, PE C0A 1W0</option>
            </select>
          </div>
          <div class="field full-width" id="newDeliveryField" hidden>
            <label for="deliveryAddress">Delivery Address</label>
            <input type="text" id="deliveryAddress" class="address-autocomplete" autocomplete="off" placeholder="Start typing an address…">
          </div>
        </section>

        <hr class="divider">

        <h2 class="section-title">Consignee</h2>
        <section class="field-group">
          <div class="field">
            <label for="businessName">Business Name</label>
            <input type="text" id="businessName" placeholder="Business name">
          </div>
          <div class="field checkbox-field">
            <label class="check-label">
              <input type="checkbox" id="notABusiness">
              <span>Not a business</span>
            </label>
          </div>
        </section>
        <section class="field-group three-col">
          <div class="field">
            <label for="consigneeName">Consignee Name</label>
            <input type="text" id="consigneeName">
          </div>
          <div class="field">
            <label for="consigneePhone">Consignee Phone</label>
            <input type="text" id="consigneePhone">
          </div>
          <div class="field">
            <label for="consigneeEmail">Consignee Email</label>
            <input type="email" id="consigneeEmail">
          </div>
        </section>

        <hr class="divider">

        <h2 class="section-title">Cargo</h2>

        <!-- Itemized cargo — LTL / LCL / Air -->
        <div id="itemizedCargo">
          <section class="field-group">
            <div class="field">
              <label for="weightUnit">Weight Unit</label>
              <select id="weightUnit">
                <option value="kg">kg</option>
                <option value="lb">lb</option>
              </select>
            </div>
            <div class="field">
              <label for="dimUnit">Dimension Unit</label>
              <select id="dimUnit">
                <option value="cm">cm</option>
                <option value="in">in</option>
              </select>
            </div>
          </section>

          <div id="cargoItems"></div>

          <button type="button" id="addCargoBtn" class="btn btn-secondary add-cargo-btn">+ Add Cargo Item</button>
        </div>

        <!-- Bulk cargo — FTL / FCL -->
        <div id="bulkCargo" hidden>
          <section class="field-group">
            <div class="field full-width">
              <label for="bulkCommodity">Commodity</label>
              <input type="text" id="bulkCommodity">
            </div>
            <div class="field">
              <label for="bulkItems">Total # of Items</label>
              <input type="number" id="bulkItems" min="0" step="1" placeholder="0">
            </div>
            <div class="field">
              <label for="bulkSpace">Space</label>
              <input type="number" id="bulkSpace" min="0" step="any" placeholder="0">
            </div>
            <div class="field">
              <label for="bulkSpaceUnit">Space Unit</label>
              <select id="bulkSpaceUnit">
                <option value="sq ft">sq ft</option>
                <option value="m³">cubic meter (m³)</option>
              </select>
            </div>
            <div class="field">
              <label for="bulkWeight">Total Weight</label>
              <input type="number" id="bulkWeight" min="0" step="any" placeholder="0">
            </div>
            <div class="field">
              <label for="bulkWeightUnit">Weight Unit</label>
              <select id="bulkWeightUnit">
                <option value="kg">kg</option>
                <option value="lb">lb</option>
              </select>
            </div>
            <div class="field full-width" id="containerSizeField">
              <label for="containerSize">Container Size Required</label>
              <select id="containerSize">
                <option value="20' Standard">20' Standard</option>
                <option value="40' Standard">40' Standard</option>
                <option value="40' High Cube">40' High Cube</option>
                <option value="45' High Cube">45' High Cube</option>
              </select>
            </div>
          </section>
        </div>

        <hr class="divider">

        <h2 class="section-title">Lift-Gate</h2>
        <section class="field-group">
          <div class="field">
            <label for="liftgateOrigin">Lift-gate at Origin</label>
            <select id="liftgateOrigin">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>
          <div class="field">
            <label for="liftgateDestination">Lift-gate at Destination</label>
            <select id="liftgateDestination">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>
        </section>
      </section>

      <section class="card results-card">
        <h2 class="section-title">Generated Email</h2>

        <div class="field">
          <label>Subject</label>
          <div class="value-with-copy email-subject-row">
            <span id="emailSubject" class="email-subject"></span>
            <button type="button" class="copy-btn" id="copySubjectBtn" title="Copy subject">⧉</button>
          </div>
        </div>

        <div class="field" style="margin-top: 16px;">
          <label>Body</label>
          <pre id="emailBody" class="email-body"></pre>
        </div>

        <button type="button" id="copyBodyBtn" class="btn btn-primary copy-body-btn">Copy Email Body</button>
      </section>
    </main>
  </div>

  <script src="email.js?v=3"></script>
</body>
</html>
